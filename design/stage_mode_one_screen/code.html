space-xs":"0.25rem","margin":"1.5rem","space-md":"1rem"},"fontFamily":{"body-md":["\"Noto Sans, Noto Sans Devanagari\""],"display-stage":["\"Noto Sans, Noto Sans Devanagari\""],"headline-md":["\"Noto Sans, Noto Sans Devanagari\""],"display-stage-mobile":["\"Noto Sans, Noto Sans Devanagari\""],"label-lg":["\"Noto Sans, Noto Sans Devanagari\""],"label-sm":["\"Noto Sans, Noto Sans Devanagari\""],"body-sm":["\"Noto Sans, Noto Sans Devanagari\""],"title-md":["\"Noto Sans, Noto Sans Devanagari\""],"headline-sm":["\"Noto Sans, Noto Sans Devanagari\""],"label-md":["\"Noto Sans, Noto Sans Devanagari\""],"headline-lg":["\"Noto Sans, Noto Sans Devanagari\""]},"fontSize":{"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"display-stage":["64px",{"lineHeight":"76px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"display-stage-mobile":["36px",{"lineHeight":"44px","letterSpacing":"-0.01em","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"500"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.04em","fontWeight":"600"}],"body-sm":["13px",{"lineHeight":"18px","fontWeight":"400"}],"title-md":["16px",{"lineHeight":"24px","fontWeight":"600"}],"headline-sm":["20px",{"lineHeight":"28px","fontWeight":"600"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"500"}],"headline-lg":["32px",{"lineHeight":"40px","fontWeight":"600"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface"><main class="w-full min-h-screen bg-surface"><div class="flex flex-col w-full">
<div class="relative flex flex-col justify-between w-full min-h-[92vh] px-space-lg py-space-lg select-none overflow-hidden" id="stage-canvas">
<div class="flex flex-wrap items-center justify-between gap-space-md px-space-lg py-space-sm rounded-xl bg-surface-container/75 backdrop-blur-md transition-opacity duration-500" id="stage-top-overlay">
<div class="flex items-center gap-space-md min-w-0">
<span class="w-2.5 h-2.5 rounded-full bg-primary-container animate-pulse shrink-0"></span>
<span class="font-title-md text-title-md text-on-surface truncate">godacho-panv • Am • 1.00x</span>
</div>
<div class="flex items-center gap-space-lg shrink-0">
<span class="font-title-md text-title-md text-primary-container tabular-nums" id="stage-timer">-02:28</span>
<span class="hidden sm:inline-flex items-center gap-space-xs px-space-sm py-space-xs rounded-lg bg-surface-container-high font-label-md text-label-md text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">keyboard_return</span>
          Hold Esc to Exit
        </span>
</div>
</div>
<div class="flex flex-col items-center justify-center text-center my-auto px-space-md py-space-xl max-w-5xl mx-auto w-full">
<div class="flex flex-col items-center gap-space-sm mb-space-xl w-full max-w-xs">
<div class="flex items-center justify-center gap-space-sm" id="beat-dots">
<span class="w-3 h-3 rounded-full bg-primary-container transition-transform duration-150 scale-110"></span>
<span class="w-2.5 h-2.5 rounded-full bg-surface-container-highest transition-transform duration-150"></span>
<span class="w-2.5 h-2.5 rounded-full bg-surface-container-highest transition-transform duration-150"></span>
<span class="w-2.5 h-2.5 rounded-full bg-surface-container-highest transition-transform duration-150"></span>
</div>
<div class="w-full h-1 rounded-full bg-surface-container-highest overflow-hidden">
<div class="h-full w-2/5 bg-primary-container rounded-full transition-all duration-300" id="lyric-progress"></div>
</div>
</div>
<p class="font-display-stage text-display-stage text-primary-container tracking-tight leading-tight mb-space-xl">
        Godacho panv, mogacho ganv
      </p>
<div class="flex flex-col items-center gap-space-md">
<p class="font-headline-lg text-headline-lg text-on-surface/50">
          Soglleank khuxal kortam
        </p>
<p class="font-headline-lg text-headline-lg text-on-surface/30">
          Ratricho vell zalo
        </p>
</div>
</div>
<div class="flex flex-wrap items-center justify-between gap-space-md px-space-lg py-space-sm rounded-xl bg-surface-container/75 backdrop-blur-md transition-opacity duration-500" id="stage-bottom-overlay">
<div class="flex items-center gap-space-md">
<button class="inline-flex items-center justify-center gap-space-sm min-h-[44px] min-w-[44px] px-space-md rounded-lg bg-primary-container text-on-primary-fixed font-label-lg text-label-lg hover:opacity-90 active:scale-95 transition-all cursor-pointer" id="play-pause-btn" type="button">
<span class="material-symbols-outlined text-[22px]" id="play-pause-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
<span id="play-pause-label">Pause</span>
</button>
<span class="hidden md:inline font-body-sm text-body-sm text-on-surface-variant">Spacebar to toggle</span>
</div>
<div class="flex items-center gap-space-sm min-w-0">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant shrink-0">queue_music</span>
<span class="font-label-lg text-label-lg text-on-surface-variant truncate">Up next: <span class="text-on-surface">Lag Ja Gale</span></span>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playPauseIcon = document.getElementById('play-pause-icon');
    const playPauseLabel = document.getElementById('play-pause-label');
    const topOverlay = document.getElementById('stage-top-overlay');
    const bottomOverlay = document.getElementById('stage-bottom-overlay');
    const stageCanvas = document.getElementById('stage-canvas');
    const beatDots = document.querySelectorAll('#beat-dots span');
    const progressBar = document.getElementById('lyric-progress');

    let isPlaying = true;
    let currentBeat = 0;
    let progress = 40;
    let hideTimeout;

    function togglePlay() {
      isPlaying = !isPlaying;
      playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      playPauseLabel.textContent = isPlaying ? 'Pause' : 'Play';
    }

    function resetOverlayTimer() {
      topOverlay.classList.remove('opacity-20');
      bottomOverlay.classList.remove('opacity-20');
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        if (isPlaying) {
          topOverlay.classList.add('opacity-20');
          bottomOverlay.classList.add('opacity-20');
        }
      }, 3000);
    }

    playPauseBtn.addEventListener('click', () => {
      togglePlay();
      resetOverlayTimer();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
        resetOverlayTimer();
      }
    });

    ['mousemove', 'touchstart'].forEach((evt) => {
      stageCanvas.addEventListener(evt, resetOverlayTimer, { passive: true });
    });

    setInterval(() => {
      if (!isPlaying) return;
      currentBeat = (currentBeat + 1) % beatDots.length;
      beatDots.forEach((dot, idx) => {
        if (idx === currentBeat) {
          dot.classList.remove('bg-surface-container-highest', 'w-2.5', 'h-2.5');
          dot.classList.add('bg-primary-container', 'w-3', 'h-3', 'scale-110');
        } else {
          dot.classList.remove('bg-primary-container', 'w-3', 'h-3', 'scale-110');
          dot.classList.add('bg-surface-container-highest', 'w-2.5', 'h-2.5');
        }
      });
      progress = progress >= 100 ? 10 : progress + 5;
      progressBar.style.width = progress + '%';
    }, 650);

    resetOverlayTimer();
  })();
</script></main></body></html>
